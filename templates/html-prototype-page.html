    <!--
      HTML 原型 AI 编写协议 v1.3（修改页面前必须完整阅读）

      目标
      - 本模板用于创建一份完整、可直接在浏览器打开的桌面端后台业务 HTML 页面。
      - 可将本模板复制为多个 HTML 文件组成多页面原型；每个文件都必须能够单独打开和运行。
      - 复制本文件创建新页面，并以本模板作为唯一的结构与实现基准；不要另建或替换壳层、全局样式及启动代码。
      - 交付物必须是 UTF-8 的完整有效 HTML；不要把解释、Markdown 代码围栏、占位 TODO 或无关 Prompt 写入文件。

      执行顺序
      1. 先确认页面用途、信息层级、主要操作、必要状态和弹窗，再开始改代码。
      2. 先更新页面身份和 SHELL_NAV，再依次修改 PAGE_STYLE、PAGE_CONTENT、PAGE_OVERLAYS、PAGE_LOGIC。
      3. 完成后按“交付自检”逐项核对；不要只保证页面看起来能打开。

      不可破坏的模板契约
      - [TEMPLATE-LOCK] 区域、所有 START/END 标记、#app、prototype-page-manifest 和启动代码不得删除、改名或移动。
      - 只修改 [AI-EDIT] 区域和带 data-shell-* 的外壳文字；外壳骨架、基础主题及统一依赖保持不变。
      - 本文件只承载一个桌面端后台业务页面；不得改造成登录页、移动端页面或同时承载多个页面。
      - 页面必须且只能有一个 data-page-content、一个 data-business-content；弹窗和抽屉统一放在 PAGE_OVERLAYS 区域。

      页面身份必须同步
      - prototype-page-manifest 是本文件内的页面身份 JSON；按字段用途更新值，不删除字段或改变 JSON 结构。
      - pageKey、rootClass、data-page-root、data-page-key 与页面内容根类使用同一 kebab-case 值。
      - 页面 CSS 以 .{rootClass} 开头；弹窗/抽屉 CSS 以 .{overlayRootClass} 开头，不写无作用域的页面样式。
      - client 是页面所属端的标识；必须等于 routePath 第一段，routePath 使用 /{client}/{page-path}。
      - <title>、manifest.pageTitle、manifest.menuTitle、页面 H1 和 data-shell-page-title 文案保持一致。
      - fileName 使用当前 HTML 文件名并保留 .html 后缀；同一组页面中的文件名不得重复。
      - menuSection、menuTitle、menuIcon 和 menu 描述导航信息；不显示导航项时仅将 menu 设为 false。
      - scriptMode、选择器、dependencies 和 assets 属于固定技术字段，没有明确要求时保持原值。
      - pageHeaderMode 仅使用 standard、back-only 或 none；none 时删除整个 data-page-header。

      HTML、Vue 与交互规则
      - data-business-content 内部可整体替换为列表、表单、详情、看板、控制台、地图或自定义布局，不保留无关示例结构。
      - 页面状态、计算属性、方法和模拟数据只能写在 PAGE_LOGIC 中；使用 Vue 3 Composition API，不污染 window。
      - SHELL_NAV 默认只作为视觉导航示例，不得添加指向不存在文件的链接或虚构跳转路径。
      - 只有确认目标 HTML 文件真实存在且确实需要跳转时，才使用标准相对链接，例如 <a href="./目标页面.html">；禁止使用 window.location 实现页面跳转。
      - 禁止 onclick 等内联事件、直接操作 DOM、jQuery、未声明依赖和重复初始化 Vue。
      - Element Plus 及自定义组件必须显式闭合；表单控件使用可见标签或 aria-label，图标按钮同时提供 Tooltip 和 aria-label。
      - 紧凑工具操作可使用图标按钮；查看、编辑、删除、审核、停用等业务操作使用清晰文字，不只依赖图标或颜色。
      - 异步操作必须处理校验失败、用户取消和 loading 复位；模拟数据应确定、可读，不调用真实接口或写入持久存储。

      CSS 与视觉规则
      - 页面专属样式只写在 PAGE_STYLE；优先使用 --app-* 与 --el-* 变量，不新增全局样式、CDN、外部字体或外部图片。
      - 页面标题 24px、区块标题 16px、正文/表格/表单/详情字段 14px、辅助信息 12-13px；不依赖浏览器默认字号。
      - 先使用布局、间距、分隔和文字层级；卡片只用于本身就是独立交互对象的内容，不堆叠无意义容器。

      交付自检
      - HTML 可直接打开；控制台无错误；加载、空数据、校验、取消、确认和分页等已用状态均可操作。
      - 多页面原型中的相对链接均指向实际存在的文件，当前页面导航项带 is-active 和 aria-current="page"。
      - Manifest 是有效 JSON，页面身份字段一致，所有 Vue 模板表达式引用的状态和方法都在 pageSetup 返回。
      - 没有修改锁定区、没有新增第二份壳层、没有重复 data-page-* 标记、没有遗留无用代码或未使用状态。
    -->

              子标题以下全部属于自由业务内容区。下面提供“筛选 + 表格”的默认结构。
              可根据实际需求删除并整体重做内部结构，例如：
              - 表单/新增流程：分组表单、步骤、费用摘要、确认区；
              - 详情页：摘要、分组资料、时间线、日志；
              - 看板/控制台：对象列表、地图、甘特图、图表、操作面板；
              - 配置页：标签页、规则区、版本和日志。
              无论使用哪种布局，只保留唯一 data-business-content 外层节点，并将 data-layout-type
              改为 list、form、detail、dashboard、console 或 custom。
            -->
            <div data-business-content data-layout-type="list">
              <section class="content-panel" data-block-id="list-panel" data-block-name="资料列表">
                <div class="filter-bar">
                  <div class="filter-fields">
                    <el-input
                      v-model="filters.keyword"
                      :prefix-icon="Search"
                      aria-label="搜索编号或名称"
                      clearable
                      placeholder="搜索编号或名称"
                    ></el-input>
                    <el-select
                      v-model="filters.status"
                      aria-label="筛选资料状态"
                      clearable
                      placeholder="全部状态"
                    >
                      <el-option label="启用" value="enabled"></el-option>
                      <el-option label="停用" value="disabled"></el-option>
                    </el-select>
                    <el-tooltip content="重置筛选" placement="top">
                      <el-button
                        circle
                        :icon="Refresh"
                        aria-label="重置筛选"
                        @click="resetFilters"
                      ></el-button>
                    </el-tooltip>
                    <el-button type="primary" plain :icon="Download" @click="exportRows">导出</el-button>
                  </div>
                  <div class="filter-summary" aria-live="polite">共 {{ filteredRows.length }} 笔资料</div>
                </div>

                <div class="table-wrap">
                  <el-table :data="pagedRows" row-key="id" stripe table-layout="fixed" style="width: 100%">
                    <el-table-column prop="code" label="编号" width="140"></el-table-column>
                    <el-table-column label="名称" min-width="220">
                      <template #default="scope">
                        <div class="name-cell">
                          <strong>{{ scope.row.name }}</strong>
                          <span>{{ scope.row.description }}</span>
                        </div>
                      </template>
                    </el-table-column>
                    <el-table-column prop="category" label="分类" min-width="150"></el-table-column>
                    <el-table-column label="状态" width="110">
                      <template #default="scope">
                        <el-tag :type="scope.row.status === 'enabled' ? 'success' : 'info'">
                          {{ scope.row.status === 'enabled' ? '启用' : '停用' }}
                        </el-tag>
                      </template>
                    </el-table-column>
                    <el-table-column prop="updatedAt" label="更新时间" width="170"></el-table-column>
                    <el-table-column label="操作" width="150" align="right">
                      <template #default="scope">
                        <el-button link type="primary" @click="openEditDialog(scope.row)">编辑</el-button>
                        <el-button link type="danger" @click="removeRow(scope.row)">删除</el-button>
                      </template>
                    </el-table-column>
                  </el-table>
                </div>

                <div class="pagination-bar">
                  <el-pagination
                    v-model:current-page="pagination.page"
                    v-model:page-size="pagination.pageSize"
                    :page-sizes="[10, 20, 50]"
                    :total="filteredRows.length"
                    layout="total, sizes, prev, pager, next, jumper"
                  ></el-pagination>
                </div>
              </section>
            </div>
            <!-- BUSINESS_CONTENT_END -->
          </section>
          <!-- PAGE_CONTENT_END -->
        </main>
      </div>

      <!-- [AI-EDIT] PAGE_OVERLAYS_START: 所有 el-dialog/el-drawer 均放在这里，不能放到 #app 外。 -->
      <el-dialog
        v-model="dialogVisible"
        class="standard-list-dialog"
        data-page-overlay="dialog"
        :title="dialogMode === 'create' ? '新增资料' : '编辑资料'"
        width="640px"
        destroy-on-close
      >
        <el-form ref="formRef" :model="form" :rules="formRules" label-width="90px">
          <el-form-item label="资料名称" prop="name">
            <el-input v-model="form.name" maxlength="30" show-word-limit></el-input>
          </el-form-item>
          <el-form-item label="资料分类" prop="category">
            <el-select v-model="form.category" placeholder="请选择分类" style="width: 100%">
              <el-option label="一般资料" value="一般资料"></el-option>
              <el-option label="重点资料" value="重点资料"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="启用状态">
            <el-switch v-model="form.enabled"></el-switch>
          </el-form-item>
          <el-form-item label="说明">
            <el-input
              v-model="form.description"
              type="textarea"
              :rows="3"
              maxlength="100"
              show-word-limit
            ></el-input>
          </el-form-item>
        </el-form>
        <template #footer>
          <div class="dialog-footer">
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" :loading="submitting" @click="submitForm">保存</el-button>
          </div>
        </template>
      </el-dialog>
      <!-- PAGE_OVERLAYS_END -->
    </div>

    <!-- TEMPLATE-LOCK: 页面运行依赖，不得修改、删除或重复引入。 -->
    <!-- PROTOTYPE_DEPENDENCIES_START -->
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/element-plus@2.8.0/dist/index.full.min.js"></script>
    <script src="https://unpkg.com/element-plus@2.8.0/dist/locale/zh-cn"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
    <!-- PROTOTYPE_DEPENDENCIES_END -->

    <script data-page-script>
      /* [AI-EDIT] PAGE_LOGIC_START: 只写页面状态、计算属性、方法和模拟数据。 */
      function pageSetup() {
        const { ref, reactive, computed, watch } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        const filters = reactive({ keyword: '', status: '' });
        const pagination = reactive({ page: 1, pageSize: 10 });
        const dialogVisible = ref(false);
        const dialogMode = ref('create');
        const editingId = ref(null);
        const submitting = ref(false);
        const formRef = ref();
        const form = reactive({ name: '', category: '', enabled: true, description: '' });

        const rows = ref([
          {
            id: 1,
            code: 'ITEM-001',
            name: '基础资料 A',
            category: '一般资料',
            status: 'enabled',
            description: '常规业务资料',
            updatedAt: '2026-07-13 10:20',
          },
          {
            id: 2,
            code: 'ITEM-002',
            name: '重点资料 B',
            category: '重点资料',
            status: 'disabled',
            description: '当前已停用',
            updatedAt: '2026-07-12 16:40',
          },
          {
            id: 3,
            code: 'ITEM-003',
            name: '基础资料 C',
            category: '一般资料',
            status: 'enabled',
            description: '最近完成更新',
            updatedAt: '2026-07-11 09:15',
          },
        ]);

        const filteredRows = computed(() => {
          const keyword = filters.keyword.trim().toLowerCase();
          return rows.value.filter((item) => {
            const matchesStatus = !filters.status || item.status === filters.status;
            const matchesKeyword =
              !keyword ||
              item.code.toLowerCase().includes(keyword) ||
              item.name.toLowerCase().includes(keyword);
            return matchesStatus && matchesKeyword;
          });
        });

        const pagedRows = computed(() => {
          const start = (pagination.page - 1) * pagination.pageSize;
          return filteredRows.value.slice(start, start + pagination.pageSize);
        });

        watch(
          () => [filters.keyword, filters.status, pagination.pageSize],
          () => {
            pagination.page = 1;
          },
        );

        const formRules = {
          name: [{ required: true, message: '请输入资料名称', trigger: 'blur' }],
          category: [{ required: true, message: '请选择资料分类', trigger: 'change' }],
        };

        function resetFilters() {
          filters.keyword = '';
          filters.status = '';
          pagination.page = 1;
        }

        function resetForm() {
          form.name = '';
          form.category = '';
          form.enabled = true;
          form.description = '';
        }

        function openCreateDialog() {
          dialogMode.value = 'create';
          editingId.value = null;
          resetForm();
          dialogVisible.value = true;
        }

        function openEditDialog(row) {
          dialogMode.value = 'edit';
          editingId.value = row.id;
          form.name = row.name;
          form.category = row.category;
          form.enabled = row.status === 'enabled';
          form.description = row.description;
          dialogVisible.value = true;
        }

        async function submitForm() {
          if (!formRef.value) return;
          const valid = await formRef.value.validate().catch(() => false);
          if (!valid) return;
          submitting.value = true;
          try {
            await new Promise((resolve) => setTimeout(resolve, 300));
            if (dialogMode.value === 'create') {
              const nextSequence = Math.max(0, ...rows.value.map((item) => item.id)) + 1;
              rows.value.unshift({
                id: nextSequence,
                code: `ITEM-${String(nextSequence).padStart(3, '0')}`,
                name: form.name,
                category: form.category,
                status: form.enabled ? 'enabled' : 'disabled',
                description: form.description || '暂无说明',
                updatedAt: '2026-07-13 14:30',
              });
            } else {
              const target = rows.value.find((item) => item.id === editingId.value);
              if (target) {
                target.name = form.name;
                target.category = form.category;
                target.status = form.enabled ? 'enabled' : 'disabled';
                target.description = form.description || '暂无说明';
              }
            }
            dialogVisible.value = false;
            ElMessage.success('保存成功');
          } finally {
            submitting.value = false;
          }
        }

        async function removeRow(row) {
          const confirmed = await ElMessageBox.confirm(`确认删除“${row.name}”吗？`, '删除确认', {
            type: 'warning',
          })
            .then(() => true)
            .catch(() => false);
          if (!confirmed) return;
          rows.value = rows.value.filter((item) => item.id !== row.id);
          ElMessage.success('删除成功');
        }

        function exportRows() {
          ElMessage.success('导出任务已创建');
        }

        return {
          Platform: ElementPlusIconsVue.Platform,
          Document: ElementPlusIconsVue.Document,
          Setting: ElementPlusIconsVue.Setting,
          Search: ElementPlusIconsVue.Search,
          Refresh: ElementPlusIconsVue.Refresh,
          Plus: ElementPlusIconsVue.Plus,
          Download: ElementPlusIconsVue.Download,
          filters,
          pagination,
          dialogVisible,
          dialogMode,
          submitting,
          formRef,
          form,
          formRules,
          filteredRows,
          pagedRows,
          resetFilters,
          openCreateDialog,
          openEditDialog,
          submitForm,
          removeRow,
          exportRows,
        };
      }
      /* PAGE_LOGIC_END */

      /* TEMPLATE-LOCK: PROTOTYPE_BOOTSTRAP_START。页面启动代码，不得修改或放入业务逻辑。 */
      const app = Vue.createApp({ setup: pageSetup });
      app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
      app.mount('#app');
      /* PROTOTYPE_BOOTSTRAP_END */
    </script>
  </body>
</html>
