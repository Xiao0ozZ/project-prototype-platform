name: Bug 报告
description: 报告可复现的平台问题，不要上传真实项目资料。
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 说明期望结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用脱敏数据给出最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js、浏览器和提交版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先删除路径、账号、令牌和客户资料。
