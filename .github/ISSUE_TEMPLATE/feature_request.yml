name: 功能建议
description: 提议可复用的平台能力。
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述用户结果，不必先限定技术方案。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 边界与替代方案
      description: 说明不应改变的行为，以及当前如何绕过。
