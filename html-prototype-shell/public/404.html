<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 · 原型工作台</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1d1d1f;
        background: #f5f7fa;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; min-height: 100vh; place-items: center; padding: 24px; }

      .error-card {
        width: min(100%, 480px);
        padding: 46px 42px 40px;
        border: 1px solid rgb(0 0 0 / 8%);
        border-radius: 24px;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 24px 70px rgb(27 45 63 / 12%);
        text-align: center;
      }

      .error-code {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        place-items: center;
        border-radius: 22px;
        color: #fff;
        background: linear-gradient(145deg, #0879b0, #005477);
        font-size: 19px;
        font-weight: 800;
        letter-spacing: .04em;
      }

      h1 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
      p { margin: 10px 0 0; color: #778292; font-size: 13px; line-height: 1.7; }
      .error-path {
        margin: 18px 0 26px;
        padding: 10px 12px;
        overflow: hidden;
        border-radius: 10px;
        color: #687587;
        background: #f2f4f7;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      a {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        padding: 0 19px;
        border-radius: 10px;
        color: #fff;
        background: #0879b0;
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        transition: transform .16s ease, background .16s ease;
      }

      a:hover { background: #00618e; transform: translateY(-1px); }
      a:active { transform: scale(.98); }

      @media (max-width: 520px) {
        .error-card { padding: 36px 22px 30px; border-radius: 20px; }
      }
    </style>
  </head>
  <body>
    <main class="error-card" role="main">
      <div class="error-code" aria-hidden="true">404</div>
      <h1>页面不存在</h1>
      <p>你访问的地址无效或已经被移除，请回到原型工作台重新选择页面。</p>
      <div class="error-path" id="errorPath">当前地址</div>
      <a href="/">回到首页</a>
    </main>
    <script>
      document.querySelector('#errorPath').textContent = window.location.pathname;
    </script>
  </body>
</html>
